<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Anime - بەڕێوەبردنی ڤیدیۆ</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
        h1, h2 { color: #bb86fc; text-align: center; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: #1e1e1e; padding: 20px; margin-bottom: 20px; border-radius: 10px; border: 1px solid #333; }
        input, button { padding: 12px; margin: 8px 0; width: 100%; border-radius: 6px; border: none; box-sizing: border-box; }
        input { background: #2c2c2c; color: #fff; }
        button { background: #bb86fc; color: #000; font-weight: bold; cursor: pointer; }
        button:hover { background: #9955e8; }
        .anime-item { background: #252525; padding: 15px; margin: 10px 0; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        video, iframe { width: 100%; max-height: 400px; border-radius: 8px; margin-top: 10px; background: #000; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎬 Aura Anime Manager</h1>

        <!-- بەشی زیادکردنی ئەنیمی -->
        <div class="card">
            <h3>زیادکردنی ئەڵقەی نوێ</h3>
            <input type="text" id="title" placeholder="ناوی ئەنیمی (بۆ نموونە: Attack on Titan)">
            <input type="text" id="season" placeholder="وەرز (بۆ نموونە: وەرزی 1)">
            <input type="text" id="episode" placeholder="ژمارەی ئەڵقە (بۆ نموونە: ئەڵقەی 1)">
            <input type="text" id="videoLink" placeholder="لینکی ڤیدیۆ (Vidmoly Embed یاخود لینکی ڕاستەوخۆی MP4)">
            <button onclick="saveAnime()">بڵاوکردنەوە و پاشەکەوتکردن</button>
        </div>

        <!-- بەشی پلەیەر و پیشاندانی ڤیدیۆ -->
        <div class="card" id="player-container" style="display:none;">
            <h3 id="playing-title">پەخشکردن</h3>
            <div id="video-wrapper"></div>
        </div>

        <!-- لیستی ئەنیمییەکان -->
        <div class="card">
            <h2>لیستی ئەنیمییە بەردەستەکان</h2>
            <div id="anime-list">
                <!-- لێرە ئەنیمییەکان دەردەکەون -->
            </div>
        </div>
    </div>

    <script>
        let animeData = JSON.parse(localStorage.getItem('aura_anime_list')) || [];

        function saveAnime() {
            const title = document.getElementById('title').value;
            const season = document.getElementById('season').value;
            const episode = document.getElementById('episode').value;
            const link = document.getElementById('videoLink').value;

            if(!title || !link) {
                alert('تکایە ناوی ئەنیمی و لینکی ڤیدیۆ پڕبکەرەوە!');
                return;
            }

            const newAnime = { title, season, episode, link };
            animeData.push(newAnime);
            localStorage.setItem('aura_anime_list', JSON.stringify(animeData));

            alert('ئەنیمییەکە بە سەرکەوتوویی زیادکرا!');
            document.getElementById('title').value = '';
            document.getElementById('season').value = '';
            document.getElementById('episode').value = '';
            document.getElementById('videoLink').value = '';

            renderAnimeList();
        }

        function renderAnimeList() {
            const listDiv = document.getElementById('anime-list');
            listDiv.innerHTML = '';

            if(animeData.length === 0) {
                listDiv.innerHTML = '<p style="text-align:center; color:#888;">هیچ ئەنیمییەک تا ئێستا نەبەستراوە.</p>';
                return;
            }

            animeData.forEach((anime, index) => {
                listDiv.innerHTML += `
                    <div class="anime-item">
                        <div>
                            <strong>${anime.title}</strong> - ${anime.season || ''} - ${anime.episode || ''}
                        </div>
                        <button style="width: auto; padding: 8px 15px;" onclick="playVideo(${index})">سەیرکردن  ▶</button>
                    </div>
                `;
            });
        }

        function playVideo(index) {
            const anime = animeData[index];
            const playerContainer = document.getElementById('player-container');
            const playingTitle = document.getElementById('playing-title');
            const videoWrapper = document.getElementById('video-wrapper');

            playerContainer.style.display = 'block';
            playingTitle.innerText = `${anime.title} - ${anime.season} - ${anime.episode}`;

            if(anime.link.includes('<iframe') || anime.link.startsWith('http')) {
                if(anime.link.startsWith('http') && !anime.link.includes('iframe')) {
                    videoWrapper.innerHTML = `<video controls src="${anime.link}"></video>`;
                } else {
                    videoWrapper.innerHTML = anime.link;
                }
            } else {
                videoWrapper.innerHTML = `<iframe src="${anime.link}" frameborder="0" allowfullscreen></iframe>`;
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        renderAnimeList();
    </script>
</body>
</html>
